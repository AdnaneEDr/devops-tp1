name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devops-tp1:1.0 .
      - run: docker run -d --name devops-tp1 -p 5000:5000 devops-tp1:1.0
      - run: sleep 3 && curl -f http://localhost:5000/
